[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "huevonitis4"
version = "4.1.1"
requires-python = ">=3.10"
dependencies = [
    "customtkinter~=5.2",
    "Pillow~=11.0",
    "opencv-python~=4.10",
    "pytesseract~=0.3.13",
    "python-docx~=1.2",
    "reportlab~=4.4",
    "numpy~=2.0",
    "lxml~=6.0",
    "tqdm~=4.66",
    "pdf2image~=1.17",
    "pdfplumber~=0.11",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default arg
    "SIM108", # ternary — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests lentos con I/O de imagen real — no corren en pytest default (usa -m slow)",
]
